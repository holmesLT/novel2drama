name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 语法检查
        run: python3 -m py_compile novel2drama.py storyboard.py render.py pipeline.py

      - name: 演示模式冒烟测试（小说 → 剧本）
        run: python3 novel2drama.py examples/sample_novel.txt --demo

      - name: 演示模式冒烟测试（剧本 → 分镜）
        run: python3 storyboard.py output/sample_novel.episode.json --demo

      - name: 校验输出为合法 JSON
        run: python3 -c "import json; json.load(open('output/sample_novel.episode.json'))"
